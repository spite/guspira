<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guspira — Warp field</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="../css/gui.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05060a;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #gl { display: block; width: 100vw; height: 100vh; }
      #gui-container {
        position: fixed; top: 12px; right: 12px; width: 340px;
        max-width: calc(100vw - 24px); z-index: 10;
      }
      #about {
        position: fixed; left: 22px; bottom: 20px; z-index: 5; max-width: 30rem;
        color: #dcdce6; font-size: 13px; line-height: 1.55;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
      }
      #about strong { display: block; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 3px; }
      #about a { color: #ffb347; }
      #about kbd {
        border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; padding: 0 4px;
        background: rgba(255, 255, 255, 0.08); font: inherit; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="gui-container"></div>
    <div id="about">
      <strong>Warp field</strong>
      Every control on the right is a uniform, so the whole image answers on the next frame.
      Drag <em>Warp</em> or <em>Fold</em> and watch it move under your hand.
      <kbd>R</kbd> rerolls, <kbd>Space</kbd> pauses, and a label click rerolls just that control.
      <a href="./">All demos</a> · <a href="../">Guspira</a>
    </div>
    <script type="module" src="./warp.js"></script>
    <script type="module" src="../theme.js"></script>
  </body>
</html>
