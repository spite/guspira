<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Guspira — DOM tests</title>
    <link rel="stylesheet" href="../css/gui.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <style>body { background: #111; } #results { color: #ddd; font: 12px monospace; white-space: pre; }</style>
  </head>
  <body>
    <div id="host"></div>
    <div id="results">running…</div>
    <script type="module">
      import GUI from "../src/gui.js";
      import { createStats } from "../src/stats.js";
      import { createParams } from "../src/params.js";
      import { createPresetStore } from "../src/presets.js";
      import { signal, effect } from "../src/reactive.js";
      import { bindKey } from "../src/keyboard.js";

      const lines = [];
      let failures = 0;
      const check = (name, cond, extra = "") => {
        lines.push(`${cond ? "ok  " : "FAIL"} ${name}${extra ? " — " + extra : ""}`);
        if (!cond) failures++;
      };
      window.onerror = (m) => { lines.push("FAIL uncaught: " + m); failures++; };

      // Only this suite's own keys: the page is linked from the site, and clearing the whole
      // origin would take every other sketch's saved settings with it.
      Object.keys(localStorage)
        .filter((key) => /^t\d?(:|-|$)/.test(key))
        .forEach((key) => localStorage.removeItem(key));

      const host = document.querySelector("#host");
      const DEFAULTS = { amount: 0.5, range: [0.2, 0.8], on: false, mode: "a", label: "x" };
      const params = createParams(DEFAULTS, { storageKey: "t" });
      const gui = new GUI("Test", host, { storageKey: "t", expanded: true });

      // --- slider: pointer drag ---------------------------------------------------
      const slider = gui.addSlider("Amount", params.amount, 0, 1, 0.01);
      const el = slider.el;
      const rect = el.getBoundingClientRect();
      check("slider has layout", rect.width > 10, `w=${rect.width}`);
      const drag = (fraction) => {
        const x = rect.left + rect.width * fraction;
        el.shadowRoot.getElementById("container").dispatchEvent(
          new PointerEvent("pointerdown", { clientX: x, clientY: rect.top + 10, bubbles: true })
        );
        window.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
      };
      drag(0.25);
      {
        const held = params.amount();
        el.shadowRoot.getElementById("container").dispatchEvent(
          new PointerEvent("pointerdown", { clientX: rect.left + 2, clientY: rect.top + 10, button: 2, bubbles: true }));
        check("a right-click does not move the slider", params.amount() === held && !el.isDragging);
      }
      check("drag writes the signal", Math.abs(params.amount() - 0.25) < 0.03, `got ${params.amount()}`);
      const display = slider.row.querySelector(".gui-slider-val");
      check("display follows the drag", display.textContent === params.amount().toFixed(2), display.textContent);

      // --- slider: programmatic write ---------------------------------------------
      params.amount.set(0.9);
      check("signal write moves the slider", el.value === 0.9, String(el.value));
      check("signal write updates the display", display.textContent === "0.90", display.textContent);

      // --- slider: keyboard --------------------------------------------------------
      el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      check("ArrowLeft steps down", Math.abs(params.amount() - 0.89) < 1e-6, String(params.amount()));
      el.dispatchEvent(new KeyboardEvent("keydown", { key: "Home", bubbles: true }));
      check("Home jumps to min", params.amount() === 0, String(params.amount()));

      // --- slider: type an exact value ---------------------------------------------
      display.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      const editor = slider.row.querySelector(".gui-slider-edit");
      check("clicking the value opens an editor", !!editor);
      editor.value = "0.37";
      editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      check("typed value commits", params.amount() === 0.37, String(params.amount()));
      check("editor closes again", !slider.row.querySelector(".gui-slider-edit"));

      // --- range slider ------------------------------------------------------------
      const rangeCtl = gui.addRangeSlider("Range", params.range, 0, 1, 0.01);
      params.range.set([0.3, 0.7]);
      check("range slider takes both handles", String(rangeCtl.el.value) === "0.3,0.7", String(rangeCtl.el.value));
      check("range display", rangeCtl.row.querySelector(".gui-slider-val").textContent === "0.30–0.70");

      // --- checkbox ----------------------------------------------------------------
      const box = gui.addCheckbox("On", params.on);
      box.el.click();
      check("checkbox click writes the signal", params.on() === true);
      params.on.set(false);
      check("signal write unchecks the box", box.el.checked === false);

      // the checkbox is drawn by the stylesheet, not by the platform, and follows the accent
      const boxStyle = getComputedStyle(box.el);
      check("the checkbox is custom-drawn", boxStyle.appearance === "none", boxStyle.appearance);
      check("…and square", boxStyle.width === boxStyle.height, `${boxStyle.width} x ${boxStyle.height}`);
      check("…with the panel's corner radius",
        boxStyle.borderRadius === getComputedStyle(gui.container).getPropertyValue("--gui-radius").trim(),
        boxStyle.borderRadius);
      check("…and a tick that renders", getComputedStyle(box.el, "::after").content !== "none");
      // The box animates between states, and getComputedStyle reports the value mid-flight,
      // so the transition is switched off for the duration of the check.
      box.el.style.transition = "none";
      params.on.set(true);
      const checkedBg = getComputedStyle(box.el).backgroundColor;
      gui.container.style.setProperty("--gui-accent", "rgb(255, 0, 0)");
      const themedBg = getComputedStyle(box.el).backgroundColor;
      check("checked follows --gui-accent", themedBg === "rgb(255, 0, 0)" && checkedBg !== themedBg,
        `${checkedBg} -> ${themedBg}`);
      gui.container.style.removeProperty("--gui-accent");
      params.on.set(false);
      box.el.style.transition = "";

      // --- select ------------------------------------------------------------------
      const sel = gui.addSelect("Mode", params.mode, [["a", "A"], ["b", "B"]]);
      sel.el.value = "b";
      sel.el.dispatchEvent(new Event("change"));
      check("select change writes the signal", params.mode() === "b");
      params.mode.set("a");
      check("signal write moves the select", sel.el.value === "a");
      const pairs = gui.addSelect("Pairs", params.label, [["x", "First"], ["y", "Second"]]);
      check("a pair list shows its labels", pairs.el.options[0].textContent === "First");
      check("…and carries its values", pairs.el.options[0].value === "x");

      // --- a monitor knows its budget too ------------------------------------------------
      {
        const load = signal(10);
        const monitorRow = gui.addMonitor("Load", load, { over: 100, format: (v) => `${v}` });
        const readout = monitorRow.row.querySelector(".gui-monitor");
        check("a monitor under budget reads normally", !readout.classList.contains("gui-over"));
        load.set(150);
        check("…and says so when it goes over", readout.classList.contains("gui-over"));
        load.set(50);
        check("…and stops saying so when it comes back", !readout.classList.contains("gui-over"));

        const floor = signal(60);
        const floorRow = gui.addMonitor("Rate", floor, { below: 55, format: (v) => `${v}` });
        const floorOut = floorRow.row.querySelector(".gui-monitor");
        check("a floor is quiet while it is met", !floorOut.classList.contains("gui-over"));
        floor.set(30);
        check("…and speaks when it is not", floorOut.classList.contains("gui-over"));

        const words = signal("fine");
        const wordRow = gui.addMonitor("Status", words, { over: 1 });
        check("a non-numeric monitor is never over budget",
          !wordRow.row.querySelector(".gui-monitor").classList.contains("gui-over"));
      }

      // --- colour formats ---------------------------------------------------------------
      {
        const hexColour = signal("#ff6500");
        const hexRow = gui.addColor("Hex", hexColour);
        check("a hex colour reaches the swatch", hexRow.el.value === "#ff6500");
        hexRow.el.value = "#0066ff";
        hexRow.el.dispatchEvent(new Event("input"));
        check("picking writes hex straight through", hexColour() === "#0066ff");

        const rgbColour = signal([1, 0.4, 0]);
        const rgbRow = gui.addColor("Rgb", rgbColour, { format: "rgb" });
        check("an rgb signal still shows a hex swatch", rgbRow.el.value === "#ff6600");
        rgbRow.el.value = "#ff0000";
        rgbRow.el.dispatchEvent(new Event("input"));
        check("…and picking writes 0..1 back, not a string", Array.isArray(rgbColour()) && rgbColour().join() === "1,0,0");

        const byteColour = signal([255, 101, 0]);
        const byteRow = gui.addColor("Bytes", byteColour, { format: "rgb255" });
        check("rgb255 shows its colour", byteRow.el.value === "#ff6500");
        byteRow.el.value = "#0000ff";
        byteRow.el.dispatchEvent(new Event("input"));
        check("…and writes bytes back", byteColour().join() === "0,0,255");

        // the reroll goes through the codec too, or it would drop a hex string into an array
        const rerolled = signal([0.5, 0.5, 0.5]);
        gui.addColor("Roll", rerolled, { format: "rgb" }).randomize();
        check("randomize yields the declared type", Array.isArray(rerolled()) && rerolled().length === 3);
        check("…in range", rerolled().every((c) => c >= 0 && c <= 1), JSON.stringify(rerolled()));

        // a custom codec is handed the value it replaces
        let sawPrevious = null;
        const custom = signal({ tag: "start", hex: "#123456" });
        const customRow = gui.addColor("Custom", custom, {
          format: {
            toHex: (v) => v.hex,
            fromHex: (hex, previous) => { sawPrevious = previous; return { tag: previous.tag, hex }; },
          },
        });
        check("a custom codec drives the swatch", customRow.el.value === "#123456");
        customRow.el.value = "#654321";
        customRow.el.dispatchEvent(new Event("input"));
        check("…is handed the value it replaces", sawPrevious && sawPrevious.tag === "start");
        check("…and can keep what hex cannot carry", custom().tag === "start" && custom().hex === "#654321");

        let badFormat = "";
        try { gui.addColor("Bad", signal("#000000"), { format: "hsl" }); } catch (e) { badFormat = e.message; }
        check("an unknown colour format is refused by name", /unknown colour format/.test(badFormat));
      }

      // --- segmented ------------------------------------------------------------------
      const blend = signal("add");
      const seg = gui.addSegmented("Blend", blend, ["over", "add", "screen"]);
      const segButtons = [...seg.el.querySelectorAll(".gui-segment")];
      check("a segment per option", segButtons.length === 3);
      check("the bound one is active", segButtons[1].classList.contains("active"));
      check("…and is the only tab stop", segButtons.filter((b) => b.tabIndex === 0).length === 1);
      segButtons[2].click();
      check("clicking a segment writes the signal", blend() === "screen");
      blend.set("over");
      check("a signal write moves the selection", segButtons[0].classList.contains("active"));
      check("…and the others say so to a screen reader", segButtons[1].getAttribute("aria-checked") === "false");
      seg.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
      check("an arrow key moves within the group", blend() === "add");
      seg.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      check("…and back again", blend() === "over");
      seg.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      check("…wrapping round the ends", blend() === "screen");
      let segChanges = 0;
      const counted = gui.addSegmented("Counted", signal("a"), ["a", "b"], { onChange: () => segChanges++ });
      const countedButtons = [...counted.el.querySelectorAll(".gui-segment")];
      countedButtons[0].click();
      check("clicking the active segment is not a change", segChanges === 0, String(segChanges));
      countedButtons[1].click();
      check("…while clicking another one is", segChanges === 1, String(segChanges));
      const pairSeg = gui.addSegmented("Pairs", signal("a"), [["a", "First"], ["b", "Second"]]);
      check("pair lists show their labels", pairSeg.el.querySelector(".gui-segment").textContent === "First");
      const segRolled = signal("over");
      gui.addSegmented("Roll", segRolled, ["over", "add", "screen"]).randomize();
      check("a segmented control rerolls to one of its options", ["over", "add", "screen"].includes(segRolled()));

      // --- text area ------------------------------------------------------------------
      const notes = signal("one\ntwo");
      const area = gui.addTextArea("Notes", notes, { rows: 4, placeholder: "notes…" });
      check("it is a textarea", area.el.tagName === "TEXTAREA");
      check("…with the rows asked for", area.el.rows === 4);
      check("…and the placeholder", area.el.placeholder === "notes…");
      check("it shows the signal, newlines and all", area.el.value === "one\ntwo");
      area.el.value = "edited\nhere";
      area.el.dispatchEvent(new Event("input"));
      check("typing writes the signal", notes() === "edited\nhere");
      notes.set("from code");
      check("a signal write reaches the box", area.el.value === "from code");
      check("it takes the full width with its label above", area.row.classList.contains("gui-row-block"));

      // --- stats graph ----------------------------------------------------------------
      const graphEl = document.createElement("stats-graph");
      graphEl.style.cssText = "width:200px;height:40px";
      document.body.append(graphEl);
      graphEl.samples = 5;
      [1, 2, 3, 4, 5, 6, 7].forEach((v) => graphEl.push(v));
      check("a graph keeps only `samples` of history", graphEl.history.length === 5);
      check("…and keeps the newest of them", graphEl.history.join() === "3,4,5,6,7");
      check("current is the latest sample", graphEl.current === 7);
      graphEl.over = 5;
      check("it knows when it is over budget", graphEl.breached === true);
      graphEl.over = 99;
      check("…and when it is not", graphEl.breached === false);
      graphEl.below = 10;
      check("a floor counts as breached too", graphEl.breached === true);
      graphEl.below = undefined;
      graphEl.draw();
      const graphCanvas = graphEl.shadowRoot.querySelector("canvas");
      const painted = graphCanvas
        .getContext("2d")
        .getImageData(0, 0, graphCanvas.width, graphCanvas.height)
        .data.filter((_, i) => i % 4 === 3 && _ > 0).length;
      check("it actually paints", painted > 20, `${painted} opaque pixels`);
      check("a connected graph is running a loop", graphEl._frame !== null);
      graphEl.remove();
      check("removing it cancels the loop", graphEl._frame === null);

      const stackEl = document.createElement("stats-graph");
      stackEl.setAttribute("stacked", "");
      stackEl.push([2, 3, 5]);
      check("a stacked graph totals its series", stackEl.current === 10);
      {
        stackEl.style.cssText = "display:block;width:200px;height:40px";
        host.append(stackEl);
        for (let i = 0; i < 20; i++) stackEl.push([2, 3, 5]);
        const realStyle = window.getComputedStyle;
        let lookups = 0;
        window.getComputedStyle = (...args) => (lookups++, realStyle(...args));
        stackEl.draw();
        window.getComputedStyle = realStyle;
        stackEl.remove();
        check("a stacked draw resolves its styles once, not per bar", lookups === 1, String(lookups));
      }

      // pausing: the source declines, so the history holds instead of scrolling
      const heldGraph = document.createElement("stats-graph");
      heldGraph.style.cssText = "display:block;width:200px;height:40px";
      document.body.append(heldGraph);
      heldGraph._visible = true;
      heldGraph.samples = 50;
      let feed = 5;
      let declining = false;
      heldGraph.source = () => (declining ? undefined : feed);
      // drive the sample step directly rather than waiting on frames, which a headless run
      // does not reliably deliver
      const pump = () => {
        const sample = heldGraph.source ? heldGraph.source() : undefined;
        if (sample !== undefined) heldGraph.push(sample);
      };
      for (let i = 0; i < 6; i++) { feed = i; pump(); }
      const running = heldGraph.history.length;
      check("a source that returns a value is sampled", running === 6, String(running));
      declining = true;
      for (let i = 0; i < 6; i++) pump();
      check("a source returning undefined adds nothing", heldGraph.history.length === running, String(heldGraph.history.length));
      check("…and the history it had is untouched", heldGraph.history.join() === "0,1,2,3,4,5", heldGraph.history.join());
      heldGraph.remove();

      const pauseFlag = signal(false);
      const pauseStats = createStats();
      const pauseTimer = pauseStats.timer("frame");
      const pausedRow = gui.addGraph("Held", pauseTimer, { pausedWhen: () => pauseFlag() });
      check("a running graph samples", pausedRow.el.source() !== undefined);
      pauseFlag.set(true);
      check("pausedWhen makes the source decline", pausedRow.el.source() === undefined);
      check("…and the row says it is held, not broken",
        pausedRow.el.parentElement.classList.contains("gui-graph-paused"));
      pauseFlag.set(false);
      check("unpausing resumes sampling", pausedRow.el.source() !== undefined);
      check("…and drops the held look", !pausedRow.el.parentElement.classList.contains("gui-graph-paused"));
      const alwaysHeld = gui.addGraph("Always held", pauseTimer, { paused: true });
      check("a constant `paused` works too", alwaysHeld.el.source() === undefined);

      // legend: names come from the counters, so a stacked graph labels itself
      const legendOf = (el) => [...el.shadowRoot.querySelectorAll(".legend span")];
      const phaseStats = createStats();
      const phases = ["move", "bounce", "clear", "paint"].map((n) => phaseStats.timer(n));
      const phaseRow = gui.addGraph("Breakdown", phases, { over: 16, format: (v) => `${v.toFixed(1)}ms` });
      check("a stacked graph gets a legend", legendOf(phaseRow.el).length === 4);
      check(
        "…named from the counters, with nothing passed",
        legendOf(phaseRow.el).map((i) => i.textContent.replace(/[\d.ms ]+$/, "")).join() === "move,bounce,clear,paint"
      );
      check(
        "…each band with its own swatch",
        new Set(legendOf(phaseRow.el).map((i) => getComputedStyle(i.querySelector("i")).backgroundColor)).size === 4
      );
      const namedRow = gui.addGraph("Custom", [signal(1), signal(2)], { series: ["Alpha", "Beta"] });
      check("`series` overrides the counter names",
        legendOf(namedRow.el).map((i) => i.textContent.replace(/[\d.ms ]+$/, "")).join() === "Alpha,Beta");
      check("plain signals with no names get no legend rather than a wrong one",
        legendOf(gui.addGraph("Plain", [signal(1), signal(2)]).el).length === 0);
      check("a single series never gets a legend", legendOf(gui.addGraph("Single", phases[0]).el).length === 0);
      const spare = document.createElement("stats-graph");
      check("colours never repeat past the named five",
        new Set(Array.from({ length: 9 }, (_, i) => spare._colour(i))).size === 9);

      const statsBag = createStats();
      const statFrame = statsBag.timer("frame");
      const statA = statsBag.timer("a");
      const statB = statsBag.timer("b");
      const graphRow = gui.addGraph("Frame", statFrame, { min: 0, over: 16.7 });
      check("addGraph builds a stats-graph", graphRow.el.tagName.toLowerCase() === "stats-graph");
      check("…and hands it the budget", graphRow.el.over === 16.7);
      check("a single signal is a line, not columns", !graphRow.el.hasAttribute("stacked"));
      const splitRow = gui.addGraph("Split", [statA, statB], { over: 16.7 });
      check("several signals means stacked", splitRow.el.hasAttribute("stacked"));
      check("…and it reads all of them", splitRow.el.source().length === 2);
      statFrame.start();
      statFrame.end();
      statsBag.flush();
      check("the source reads the counter", typeof graphRow.el.source() === "number");
      const orphan = graphRow.el;
      graphRow.destroy();
      check("destroying the row stops the graph", orphan._frame === null);

      // --- slider curves --------------------------------------------------------------
      const curveDrag = (element, fraction) => {
        const box = element.getBoundingClientRect();
        element.shadowRoot.getElementById("container").dispatchEvent(
          new PointerEvent("pointerdown", { clientX: box.left + box.width * fraction, clientY: box.top + 10, bubbles: true })
        );
        window.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
      };
      const curved = signal(5);
      const curvedRow = gui.addSlider("Curved", curved, 0, 10, 0.01, { curve: 2 });
      curveDrag(curvedRow.el, 0.5);
      check("curve 2 puts a quarter of the range at the middle", Math.abs(curved() - 2.5) < 0.2);
      const freq = signal(632);
      const logRow = gui.addSlider("Freq", freq, 20, 20000, 1, { curve: "log" });
      curveDrag(logRow.el, 0.5);
      check("a log track's midpoint is the geometric mean", Math.abs(freq() - 632) < 30);
      curveDrag(logRow.el, 0.25);
      check("…and each quarter is the same ratio again", Math.abs(freq() - 112) < 12);
      freq.set(632);
      check("the thumb sits where the drag would put it", Math.abs(logRow.el.valueToPercentage(632) - 50) < 0.5);
      freq.set(1000);
      logRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
      check("an arrow steps by one step, not a slice of track", freq() === 1001);
      freq.set(50);
      logRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
      check("…the same amount at the sparse end of the track", freq() === 51);
      let belowMid = 0;
      for (let i = 0; i < 400; i++) { logRow.randomize(); if (freq() < 632) belowMid++; }
      check("randomize rolls along the track, not across the values", belowMid > 130 && belowMid < 270, `${belowMid}/400`);
      check("no curve still means linear", gui.addSlider("Plain", signal(1), 0, 10, 0.1).el.curve === 1);
      const band = gui.addRangeSlider("Band", signal([100, 1000]), 20, 20000, 1, { curve: "log" });
      check("a dual slider takes a curve too", band.el.curve === "log");
      let curveRefused = "";
      try { gui.addSlider("Bad", signal(1), 0, 100, 1, { curve: "log" }); } catch (e) { curveRefused = e.message; }
      check("a log range through zero is refused at construction", /non-zero and the same sign/.test(curveRefused));
      let curveName = "";
      try { gui.addSlider("Bad", signal(1), 1, 100, 1, { curve: "logarithmic" }); } catch (e) { curveName = e.message; }
      check("an unknown curve names what is valid", /positive number or "log"/.test(curveName));

      // --- vector -------------------------------------------------------------------
      const vecSignal = signal([0, 1.5, -2]);
      const held = vecSignal.peek();
      const vec = gui.addVector("Position", vecSignal, { min: -10, max: 10, step: 0.1 });
      check("a vec3 makes one input per axis", vec.inputs.length === 3);
      check("axes show the current value", vec.inputs.map((i) => i.value).join() === "0.0,1.5,-2.0");
      vec.inputs[1].value = "3.5";
      vec.inputs[1].dispatchEvent(new Event("input"));
      check("editing one axis writes the whole vector", JSON.stringify(vecSignal()) === "[0,3.5,-2]");
      check("…without mutating the array the sketch held", JSON.stringify(held) === "[0,1.5,-2]");
      vec.inputs[0].value = "999";
      vec.inputs[0].dispatchEvent(new Event("input"));
      check("an axis clamps to its max", vecSignal()[0] === 10);
      vecSignal.set([-1, -2, -3]);
      check("a signal write moves the axes", vec.inputs.map((i) => i.value).join() === "-1.0,-2.0,-3.0");
      check("each axis is labelled for screen readers", vec.inputs[2].getAttribute("aria-label") === "Position z");
      const vec2 = gui.addVector("UV", signal([0.25, 0.75]));
      check("the axis count comes from the value", vec2.inputs.length === 2);
      const perAxis = gui.addVector("Rot", signal([0, 0, 0]), { min: [-180, -90, -180], max: [180, 90, 180], step: 1 });
      check("min/max can differ per axis", perAxis.inputs[0].min === "-180" && perAxis.inputs[1].min === "-90");
      let vecRefused = "";
      try { gui.addVector("Bad", signal(5)); } catch (e) { vecRefused = e.message; }
      check("a non-array signal is refused with a clear message", /array/.test(vecRefused));

      // --- scrubbing a number field -------------------------------------------------
      const scrubDrag = (el, dx, extra = {}) => {
        const P = (type, x) =>
          new PointerEvent(type, { clientX: x, button: 0, buttons: 1, pointerId: 1, bubbles: true, ...extra });
        el.dispatchEvent(P("pointerdown", 100));
        el.dispatchEvent(P("pointermove", 100 + dx));
        el.dispatchEvent(P("pointerup", 100 + dx));
      };
      const scrubbed = signal(10);
      const numRow = gui.addNumber("Scrub", scrubbed, { min: 0, max: 100, step: 1 });
      scrubDrag(numRow.el, 25);
      check("dragging a number field right raises it", scrubbed() === 35);
      scrubDrag(numRow.el, -15);
      check("dragging left lowers it", scrubbed() === 20);
      scrubbed.set(50);
      scrubDrag(numRow.el, 999);
      check("a scrub clamps to max", scrubbed() === 100);
      scrubbed.set(42);
      const tap = (type, x) => new PointerEvent(type, { clientX: x, button: 0, buttons: 1, pointerId: 1, bubbles: true });
      numRow.el.dispatchEvent(tap("pointerdown", 100));
      numRow.el.dispatchEvent(tap("pointermove", 101));
      numRow.el.dispatchEvent(tap("pointerup", 101));

      const savedRow = built.saved.row;
      check("the saved row carries its two buttons", savedRow.querySelectorAll(".gui-btn-mini").length === 2);
      check("…and still shows its label", built.saved.labelEl.getBoundingClientRect().width > 30);
      check("…without overflowing the row",
        built.saved.el.getBoundingClientRect().right <= savedRow.getBoundingClientRect().right + 1);
      const fileRow = built.files.row;
      const [exportBtn, importBtn] = built.files.buttons;
      check("export and import share one row",
        Math.abs(exportBtn.getBoundingClientRect().top - importBtn.getBoundingClientRect().top) < 1);
      check("…splitting it evenly",
        Math.abs(exportBtn.getBoundingClientRect().width - importBtn.getBoundingClientRect().width) < 2,
        `${exportBtn.getBoundingClientRect().width} vs ${importBtn.getBoundingClientRect().width}`);
      check("…and filling it",
        fileRow.getBoundingClientRect().width - (importBtn.getBoundingClientRect().right - exportBtn.getBoundingClientRect().left) < 6);
      {
        // Export is of the values on screen, whatever happens to be selected in the saved list
        uiStore.save("kept");
        built.refresh("kept");
        const before = params.amount();
        params.amount.set(before === 0.33 ? 0.34 : 0.33);
        const realCreate = URL.createObjectURL;
        const realClick = HTMLAnchorElement.prototype.click;
        let blob = null;
        URL.createObjectURL = (b) => { blob = b; return "blob:stub"; };
        HTMLAnchorElement.prototype.click = function () {};
        built.files.buttons[0].click();
        URL.createObjectURL = realCreate;
        HTMLAnchorElement.prototype.click = realClick;
        const exported = JSON.parse(await blob.text());
        check("Export downloads the current values, not the selected saved preset",
          exported.amount === params.amount(), `${exported.amount} vs ${params.amount()}`);
        params.amount.set(before);
        uiStore.remove("kept");
      }
      presetSection.destroy();
      gui.endSection();

      // a travelling parameter: the widget must show where the value was put, not where the
      // animation currently is, or it would fight the hand dragging it
      const slow = createParams({ amount: 0 }, { ease: 400 });
      const slowRow = gui.addSlider("Travelling", slow.amount, 0, 1, 0.01);
      check("a travelling parameter is a tween", slow.amount.target !== slow.amount);
      slowRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "End", bubbles: true }));
      check("the widget writes the target", slow.amount.target() === 1, String(slow.amount.target()));
      check("…the value is still travelling", slow.amount() < 1, String(slow.amount()));
      check("…and the thumb shows the target, not the animation",
        slowRow.el.value === 1, String(slowRow.el.value));
      check("…as does the number beside it",
        slowRow.row.querySelector(".gui-slider-val").textContent === "1.00",
        slowRow.row.querySelector(".gui-slider-val").textContent);
      let reported = null;
      slow.amount.reset(0);
      const rolledRow = gui.addSlider("Rolled", slow.amount, 0.5, 1, 0.01, { onChange: (v) => (reported = v) });
      rolledRow.randomize();
      rolledRow.destroy();
      check("a reroll reports the value it set, not the one still travelling",
        reported === slow.amount.target() && reported !== slow.amount(), `${reported} vs ${slow.amount.target()}`);
      slowRow.destroy();

      // --- presets, out to a file and back ---------------------------------------------
      // The most breakable path in the library: it crosses Blob, an <a download>, FileReader
      // and JSON.parse, and none of that is reachable from the node suites.
      {
        const fileParams = createParams({ amount: 0.5, tint: "#ff8a3d", mode: "a" });
        const fileStore = createPresetStore(fileParams, { builtin: {} });

        // exportFile hands a Blob to URL.createObjectURL and clicks a link; stub the two so
        // the download is captured instead of attempted.
        const realCreate = URL.createObjectURL;
        const realRevoke = URL.revokeObjectURL;
        const realClick = HTMLAnchorElement.prototype.click;
        let captured = null;
        let downloadName = null;
        URL.createObjectURL = (blob) => { captured = blob; return "blob:stub"; };
        URL.revokeObjectURL = () => {};
        HTMLAnchorElement.prototype.click = function () { downloadName = this.download; };

        fileParams.amount.set(0.25);
        fileParams.tint.set("#2f6fd0");
        fileStore.exportFile("a-look");

        URL.createObjectURL = realCreate;
        URL.revokeObjectURL = realRevoke;
        HTMLAnchorElement.prototype.click = realClick;

        check("exportFile produced a download", !!captured && downloadName === "a-look.json", String(downloadName));

        const text = await captured.text();
        const parsed = JSON.parse(text);
        check("…of the current values", parsed.amount === 0.25 && parsed.tint === "#2f6fd0", text);

        // now the other direction, from a real File
        fileParams.amount.set(0.9);
        fileParams.tint.set("#ffffff");
        const file = new File([text], "a-look.json", { type: "application/json" });
        const applied = await fileStore.importFile(file);
        check("importFile applied the file", fileParams.amount() === 0.25 && fileParams.tint() === "#2f6fd0",
          `${fileParams.amount()} ${fileParams.tint()}`);
        check("…and reported what it applied", applied.includes("amount") && applied.includes("tint"),
          applied.join(","));

        // a wrapped file, the shape a hand-written preset tends to take
        const wrapped = new File(
          [JSON.stringify({ name: "wrapped", params: { amount: 0.75 } })],
          "w.json",
          { type: "application/json" }
        );
        await fileStore.importFile(wrapped);
        check("a { name, params } file works too", fileParams.amount() === 0.75, String(fileParams.amount()));
        check("…and is remembered under its name", fileStore.userNames().includes("wrapped"),
          fileStore.userNames().join(","));

        // a store whose own parameters are called `name` and `params` is not a wrapper
        {
          const named = createParams({ name: "a", params: 1 });
          const namedStore = createPresetStore(named);
          await namedStore.importFile(new File([JSON.stringify({ name: "b", params: 2 })], "n.json"));
          check("a bare file with a `name` parameter is applied as values",
            named.name() === "b" && named.params() === 2, `${named.name()} ${named.params()}`);
          check("…and saves no preset under it", namedStore.userNames().length === 0);
        }

        // and a broken one rejects rather than throwing into the void
        let rejected = false;
        await fileStore.importFile(new File(["{ not json"], "bad.json")).catch(() => (rejected = true));
        check("a malformed file rejects", rejected);
        check("…leaving the values alone", fileParams.amount() === 0.75, String(fileParams.amount()));
      }

      // --- names, ranges and what a field shows -------------------------------------------
      {
        const g = new GUI("Named", host, { expanded: true });
        const named = {
          slider: g.addSlider("Speed", signal(1), 0, 2, 0.1),
          range: g.addRangeSlider("Size", signal([0, 1]), 0, 2, 0.1),
          checkbox: g.addCheckbox("Paused", signal(false)),
          select: g.addSelect("Palette", signal("a"), ["a", "b"]),
          colour: g.addColor("Tint", signal("#ff0000")),
          text: g.addTextInput("Name", signal("x")),
          area: g.addTextArea("Notes", signal("x")),
          number: g.addNumber("Seed", signal(1)),
        };
        const unnamed = Object.entries(named)
          .filter(([, c]) => document.getElementById(c.el.getAttribute("aria-labelledby")) !== c.labelEl)
          .map(([kind]) => kind);
        check("every labelled control is named by its label", unnamed.length === 0, unnamed.join(", "));
        check("a dual slider reports one number, and both ends as text",
          named.range.el.getAttribute("aria-valuenow") === "1" && named.range.el.getAttribute("aria-valuetext") === "0 to 1",
          `${named.range.el.getAttribute("aria-valuenow")} / ${named.range.el.getAttribute("aria-valuetext")}`);
        const grouped = g.addSection("Group");
        check("a section's rows are a group named by its title",
          grouped.body.getAttribute("role") === "group" &&
            document.getElementById(grouped.body.getAttribute("aria-labelledby")) === grouped.row.querySelector(".gui-section-title"));
        g.endSection();

        const idle = getComputedStyle(named.area.el).borderColor;
        named.area.el.focus();
        check("a focused text area shows it", getComputedStyle(named.area.el).borderColor !== idle,
          getComputedStyle(named.area.el).borderColor);
        named.area.el.blur();
        const pressable = g.addButton("Sized", () => {});
        g.container.style.setProperty("--gui-font-size", "20px");
        check("--gui-font-size reaches more than the labels",
          getComputedStyle(pressable.el).fontSize === "19px" &&
            getComputedStyle(grouped.row.querySelector(".gui-section-title")).fontSize === "17px",
          `${getComputedStyle(pressable.el).fontSize}, ${getComputedStyle(grouped.row.querySelector(".gui-section-title")).fontSize}`);
        g.container.style.removeProperty("--gui-font-size");

        const loose = signal(0.5);
        const looseRow = g.addSlider("No step", loose, 0, 1);
        looseRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        check("a slider with no step takes a hundredth of its range", loose() === 0.51, String(loose()));
        const flat = signal(5);
        const flatRow = g.addSlider("No width", flat, 5, 5);
        flatRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        check("…and one with no width keeps its value", flat() === 5, String(flat()));
        let stepRefused = "";
        try { g.addSlider("Bad step", signal(1), 0, 1, { onChange() {} }); } catch (e) { stepRefused = e.message; }
        check("options in the step's place are refused by name", /step must be a positive number/.test(stepRefused), stepRefused);

        const capped = signal(0);
        const cappedRow = g.addSlider("Capped", capped, 0, 0.75, 0.1);
        cappedRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "End", bubbles: true }));
        check("a max off the step grid is reached, not passed", capped() === 0.75, String(capped()));

        const odd = signal(1);
        const oddRow = g.addSlider("Odd", odd, 1, 10, 2);
        oddRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        check("a slider's stops are counted from its min", odd() === 3, String(odd()));
        oddRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "Home", bubbles: true }));
        check("…so the min itself is one of them", odd() === 1, String(odd()));
        const fine = signal(0.25);
        const fineRow = g.addSlider("Fine", fine, 0.25, 1, 0.1);
        fineRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        check("a min finer than the step shows in the number beside the slider",
          fine() === 0.35 && fineRow.row.querySelector(".gui-slider-val").textContent === "0.35",
          `${fine()} shown as ${fineRow.row.querySelector(".gui-slider-val").textContent}`);

        const typed = signal(5);
        const typedRow = g.addNumber("Typed", typed, { min: 0, max: 10, step: 1 });
        typedRow.el.focus();
        typedRow.el.value = "250.5";
        typedRow.el.dispatchEvent(new Event("input"));
        check("a typed number is held to its range", typed() === 10, String(typed()));
        check("…while the field keeps what is being typed", typedRow.el.value === "250.5", typedRow.el.value);
        typedRow.el.blur();
        check("…and shows what was stored once focus leaves", typedRow.el.value === "10", typedRow.el.value);
        typedRow.el.focus();
        typedRow.el.value = "";
        typedRow.el.dispatchEvent(new Event("input"));
        typedRow.el.blur();
        check("an emptied number field shows its number again", typedRow.el.value === "10", typedRow.el.value);

        const axes = signal([1, 2, 3]);
        const axesRow = g.addVector("Axes", axes, { step: 0.1 });
        axesRow.inputs[0].focus();
        axesRow.inputs[0].value = "";
        axesRow.inputs[0].dispatchEvent(new Event("input"));
        axesRow.inputs[0].blur();
        check("…and so does a vector axis", axesRow.inputs[0].value === "1.0", axesRow.inputs[0].value);

        const words = signal("abc");
        const wordsRow = g.addTextInput("Words", words);
        wordsRow.el.focus();
        words.set("from code");
        check("a text field being typed in is left alone", wordsRow.el.value === "abc", wordsRow.el.value);
        wordsRow.el.blur();
        check("…and catches up when focus leaves", wordsRow.el.value === "from code", wordsRow.el.value);

        const exact = signal(0.5);
        const exactRow = g.addSlider("Exact", exact, 0, 1, 0.01);
        exactRow.el.focus();
        exactRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        const exactEditor = exactRow.row.querySelector(".gui-slider-edit");
        exactEditor.value = "0.7";
        exactEditor.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        check("Enter in the value editor hands focus back to the slider",
          exact() === 0.7 && document.activeElement === exactRow.el, document.activeElement.tagName);

        const spot = signal([0.5, 0.5]);
        const spotRow = g.addPad("Spot", spot);
        const spotBox = spotRow.el.getBoundingClientRect();
        const pressPad = (button) => spotRow.el.dispatchEvent(new PointerEvent("pointerdown", {
          clientX: spotBox.left + 2, clientY: spotBox.top + 2, button, pointerId: 9, bubbles: true,
        }));
        pressPad(2);
        check("a right-click leaves a pad alone", spot().join() === "0.5,0.5", spot().join());
        pressPad(0);
        check("a press on a pad writes where it landed", spot()[0] < 0.1 && spot()[1] < 0.1, spot().join());

        const none = signal("nothing");
        const noneRow = g.addSegmented("None yet", none, ["a", "b", "c", "d"]);
        noneRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
        check("ArrowLeft with nothing selected starts from the last option", none() === "d", none());
        none.set("nothing");
        noneRow.el.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        check("…and ArrowRight from the first", none() === "a", none());
        g.destroy();
      }

      // --- what a panel-wide reroll leaves alone -------------------------------------------
      {
        const g = new GUI("Rolls", host, { expanded: true });
        const rolls = [signal(0.5), signal(0.5), signal(0.5)];
        rolls.forEach((sig, i) => g.addSlider(`Roll ${i}`, sig, 0, 1, 0.001));
        let passes = 0;
        const stopCounting = effect(() => { rolls.forEach((sig) => sig()); passes++; });
        passes = 0;
        g.randomizeAll();
        check("a panel-wide reroll is one pass of effects", passes === 1, String(passes));
        stopCounting();

        const inside = signal(0.5);
        g.addSection("Locked", { disabled: true });
        const insideRow = g.addSlider("Inside", inside, 0, 1, 0.001);
        g.endSection();
        for (let i = 0; i < 5; i++) g.randomizeAll();
        insideRow.labelEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        check("a reroll leaves a disabled section's controls alone", inside() === 0.5, String(inside()));

        const looks = createParams({ look: 0.5, seed: 7 });
        const lookStore = createPresetStore(looks, { builtin: { one: { seed: 111 }, two: { seed: 222 } } });
        g.addSlider("Look", looks.look, 0, 1, 0.001);
        g.addSlider("Seed", looks.seed, 0, 999, 1, { randomizable: false });
        const lookRows = g.addPresets(lookStore);
        for (let i = 0; i < 20; i++) g.randomizeAll();
        check("a reroll does not roll the preset picker over a pinned value", looks.seed() === 7, String(looks.seed()));

        looks.seed.set(42);
        lookStore.save("one");
        lookRows.refresh("one");
        looks.seed.set(7);
        lookRows.load.click();
        check("Load restores a saved preset that shares a built-in's name", looks.seed() === 42, String(looks.seed()));
        lookRows.builtin.el.value = "one";
        lookRows.builtin.el.dispatchEvent(new Event("change"));
        check("…while the built-in picker still applies the built-in", looks.seed() === 111, String(looks.seed()));

        const bare = g.addPresets(createPresetStore(createParams({ x: 1 })));
        check("with no built-in presets there is no built-in picker", !bare.builtin);
        g.destroy();
      }

      // --- where rows land ---------------------------------------------------------------
      {
        const g = new GUI("Places", host, { expanded: true });
        const first = g.addTab("One");
        const inFirst = g.addSection("In one");
        const second = g.addTab("Two");
        g.selectTab(5);
        check("selecting a tab that is not there changes nothing",
          g.container.querySelectorAll(".gui-tab-panel.active").length === 1);
        const nested = g.into(inFirst, () => g.addSection("Late"));
        check("a section added from inside a section lands in that section's tab", first.panel.contains(nested.row));
        second.destroy();
        const orphan = g.addSlider("After", signal(1), 0, 2, 0.1);
        check("a row added after its tab was destroyed lands in the one that is left", first.panel.contains(orphan.row));
        g.destroy();
      }

      // --- rows and panels built while an effect is running --------------------------------
      {
        const g = new GUI("Owned", host, { expanded: true });
        const again = signal(0);
        const followed = signal(0.25);
        let built = null;
        let nestedPanel = null;
        const stopOwner = effect(() => {
          again();
          if (!built) built = g.addSlider("Built in an effect", followed, 0, 1, 0.01);
          if (!nestedPanel) nestedPanel = new GUI("Inner", host, { expanded: true });
        });
        again.set(1);
        followed.set(0.75);
        check("a row built inside an effect outlives that effect's next run", built.el.value === 0.75, String(built.el.value));
        nestedPanel.titleEl.click();
        check("…and so does a panel", nestedPanel.container.classList.contains("collapsed"));
        stopOwner();
        nestedPanel.destroy();
        g.destroy();
      }

      // --- key bindings stay out of the way of the control that has the key -----------------
      {
        const g = new GUI("Keys in use", host, { expanded: true });
        const pressed = g.addButton("Go", () => {});
        const moved = g.addSlider("Moved", signal(1), 0, 2, 0.1);
        const counts = { space: 0, left: 0, held: 0, repeated: 0 };
        const unbinds = [
          bindKey("Space", () => counts.space++),
          bindKey("ArrowLeft", () => counts.left++),
          bindKey("KeyP", () => counts.held++),
          bindKey("KeyO", () => counts.repeated++, { repeat: true }),
        ];
        const press = (el, code, extra = {}) =>
          el.dispatchEvent(new KeyboardEvent("keydown", { code, bubbles: true, ...extra }));
        press(pressed.el, "Space");
        check("Space on a button presses the button, not a binding", counts.space === 0, String(counts.space));
        press(document.body, "Space");
        check("…and anywhere else it is the binding", counts.space === 1, String(counts.space));
        press(moved.el, "ArrowLeft");
        check("an arrow on a slider moves the slider, not a binding", counts.left === 0, String(counts.left));
        for (let i = 0; i < 4; i++) press(document.body, "KeyP", { repeat: i > 0 });
        check("a held key fires its binding once", counts.held === 1, String(counts.held));
        for (let i = 0; i < 4; i++) press(document.body, "KeyO", { repeat: i > 0 });
        check("…unless the binding asks for repeats", counts.repeated === 4, String(counts.repeated));
        unbinds.forEach((unbind) => unbind());
        g.destroy();
      }

      // --- the slider element on its own -------------------------------------------------
      {
        const lone = document.createElement("range-slider");
        lone.setAttribute("min", "0");
        lone.setAttribute("max", "1");
        lone.setAttribute("step", "0.01");
        host.append(lone);
        check("a slider with no value sits mid-range", lone.value === 0.5, String(lone.value));
        lone.max = 4;
        check("…wherever the range goes, until it is given one", lone.value === 2, String(lone.value));
        lone.value = 1;
        lone.max = 10;
        check("…after which it keeps it", lone.value === 1, String(lone.value));
        lone.step = "nonsense";
        check("an unusable step is ignored", lone.step === 0.01, String(lone.step));
        lone.remove();

        const pair = document.createElement("range-slider");
        pair.setAttribute("dual", "");
        pair.setAttribute("min", "10");
        pair.setAttribute("max", "20");
        host.append(pair);
        check("a dual slider with no value spans its range", pair.value.join() === "10,20", pair.value.join());
        pair.remove();

        const logs = document.createElement("range-slider");
        let orderMatters = false;
        try {
          logs.curve = "log";
          logs.min = 20;
          logs.max = 20000;
          logs.value = 632;
        } catch { orderMatters = true; }
        check("curve can be assigned before min and max",
          !orderMatters && Math.abs(logs.valueToPercentage(632) - 50) < 0.5, String(logs.valueToPercentage(632)));

        const g = new GUI("Two hands", host, { expanded: true });
        const hands = [signal(0.5), signal(0.5)];
        const rows = hands.map((sig, i) => g.addSlider(`Hand ${i}`, sig, 0, 1, 0.01));
        const boxes = rows.map((row) => row.el.getBoundingClientRect());
        rows.forEach((row, i) => row.el.shadowRoot.getElementById("container").dispatchEvent(
          new PointerEvent("pointerdown", { clientX: boxes[i].left + boxes[i].width * 0.5, pointerId: i + 1, bubbles: true })));
        window.dispatchEvent(new PointerEvent("pointermove", {
          clientX: boxes[1].left + boxes[1].width * 0.9, pointerId: 2, bubbles: true }));
        check("a second pointer moves only the slider it is on",
          hands[0]() === 0.5 && Math.abs(hands[1]() - 0.9) < 0.03, `${hands[0]()} ${hands[1]()}`);
        window.dispatchEvent(new PointerEvent("pointerup", { pointerId: 2, bubbles: true }));
        check("…and lifting it ends only that drag", rows[0].el.isDragging && !rows[1].el.isDragging);
        window.dispatchEvent(new PointerEvent("pointerup", { pointerId: 1, bubbles: true }));
        g.destroy();
      }

      // --- the graph element follows its box and its colours --------------------------------
      {
        const tall = document.createElement("stats-graph");
        tall.style.cssText = "display:block;width:200px";
        tall.setAttribute("stacked", "");
        host.append(tall);
        tall.series = ["A", "B"];
        for (let i = 0; i < 5; i++) tall.push([1, 2]);
        tall.draw();
        const shortHeight = tall.canvas.height;
        tall.style.setProperty("--gui-graph-height", "90px");
        tall.draw();
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        check("a graph made taller redraws at its new height",
          tall.canvas.height > shortHeight && tall.canvas.height === Math.round(tall.canvas.clientHeight * scale),
          `${shortHeight} -> ${tall.canvas.height}`);
        tall.style.setProperty("--gui-series-1", "rgb(1, 2, 3)");
        check("a legend swatch follows its colour variable",
          getComputedStyle(tall.shadowRoot.querySelector(".legend i")).backgroundColor === "rgb(1, 2, 3)");
        tall.min = undefined;
        check("clearing min is not a NaN", tall.min === undefined, String(tall.min));
        tall.remove();
      }

      // --- what is saved, and when --------------------------------------------------------
      {
        const kept = createParams({ a: 1, b: 2 }, { storageKey: "t5" });
        window.dispatchEvent(new Event("pagehide"));
        check("leaving a page nothing was changed on saves nothing", localStorage.getItem("t5") === null,
          String(localStorage.getItem("t5")));
        kept.a.set(5);
        window.dispatchEvent(new Event("pagehide"));
        check("a change still waiting is saved as the page goes", localStorage.getItem("t5") === '{"a":5}',
          String(localStorage.getItem("t5")));
        kept.b.set(9);
        kept.$clear();
        window.dispatchEvent(new Event("pagehide"));
        check("$clear() holds through the page going away", localStorage.getItem("t5") === null,
          String(localStorage.getItem("t5")));
        kept.$stop();
      }

      // --- panel destroy --------------------------------------------------------------
      const gui4 = new GUI("Bye", host);
      const c4 = gui4.addSlider("x", signal(1), 0, 2, 0.1);
      gui4.destroy();
      check("gui.destroy removes the panel", !gui4.container.isConnected && !c4.row.isConnected);

      document.querySelector("#results").textContent =
        lines.join("\n") + "\n\n" + (failures ? `${failures} FAILURES` : "ALL PASS");
    </script>
    <script type="module" src="../theme.js"></script>
  </body>
</html>
